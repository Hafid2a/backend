version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: najd
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: najd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U najd"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://najd:localdev@db:5432/najd
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
