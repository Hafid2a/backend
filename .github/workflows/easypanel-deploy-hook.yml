# Optional: after each push to main, ask Easypanel to start a new deployment that
# pulls the latest commit from the Source tab’s configured branch.
#
# 1. Easypanel → backend app → find "Deploy Webhook" URL.
# 2. GitHub repo → Settings → Secrets → Actions → New secret:
#    name: EASYPANEL_DEPLOY_WEBHOOK  value: <paste webhook URL>
#
# If the secret is not set, this workflow does nothing (does not fail).

name: Easypanel deploy hook

on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Easypanel deployment
        env:
          HOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "EASYPANEL_DEPLOY_WEBHOOK not set; skip (see workflow file header)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Easypanel deploy triggered."
